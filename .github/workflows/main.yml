# Runs on GitHub Actions when you open/update a PR targeting `main`
# (and on pushes to `main`). No extra config needed besides committing this file.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # Build + `auth()` compile need keys present; these are not used to hit real Clerk in CI.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_a_real_key_000000000000
      CLERK_SECRET_KEY: sk_test_ci_placeholder_not_a_real_secret_000000000000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
